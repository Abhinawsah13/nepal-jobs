<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nepal Jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'job_list' %}">Nepal Jobs</a>
    </div>
  </nav>

  <div class="container">
    <form method="get" class="d-flex mb-4">
      <input type="text" name="q" value="{{ query }}" class="form-control me-2"
             placeholder="Search title, company or location">
      <button class="btn btn-primary">Search</button>
    </form>

    {% for job in jobs %}
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">
            <a href="{% url 'job_detail' job.pk %}" class="text-decoration-none">{{ job.title }}</a>
            <span class="badge bg-secondary">{{ job.get_job_type_display }}</span>
          </h5>
          <p class="card-text text-muted mb-0">
            {{ job.company }} · {{ job.location }}{% if job.salary %} · NPR {{ job.salary }}{% endif %}
          </p>
        </div>
      </div>
    {% empty %}
      <p>No jobs found.</p>
    {% endfor %}
  </div>
</body>
</html>
